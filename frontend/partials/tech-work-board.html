<!-- ╔══════════════════════════════════════════════════════════════════╗ -->
<!-- ║  Tech Work Board partial                                        ║ -->
<!-- ║  Registers PAGE: tech-board                                     ║ -->
<!-- ║  Managers: all open tickets for owned depts, grouped by tech    ║ -->
<!-- ║  Techs: only their own assigned tickets                         ║ -->
<!-- ╚══════════════════════════════════════════════════════════════════╝ -->
<style>
/* ── Tech Work Board ─────────────────────────────────────────────── */
.twb-wrap{padding:20px 24px;}
.twb-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.twb-title{font-size:15px;font-weight:700;color:var(--text-primary);flex:1;}
.twb-count{font-size:12px;color:var(--text-secondary);background:var(--bg-subtle);border:1px solid var(--border-default);border-radius:4px;padding:2px 8px;}
.twb-search{height:30px;padding:0 10px;border:1px solid var(--border-default);border-radius:6px;font-size:12.5px;width:200px;outline:none;color:var(--text-primary);}
.twb-search:focus{border-color:var(--brand-navy);}

/* Tech group cards */
.twb-tech-group{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:14px;}
.twb-tech-hdr{padding:10px 16px;background:var(--brand-navy);display:flex;align-items:center;gap:10px;}
.twb-avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0;}
.twb-tech-name{font-size:13px;font-weight:600;color:#fff;flex:1;}
.twb-tech-dept{font-size:11px;color:rgba(255,255,255,.55);margin-right:4px;}
.twb-tech-stats{display:flex;gap:8px;align-items:center;}
.twb-stat-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;}
.twb-stat-badge.crit{background:var(--status-critical);}
.twb-stat-badge.avail{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-weight:400;}
.twb-no-tickets{padding:10px 16px;font-size:12px;color:var(--text-tertiary);font-style:italic;}

/* Unassigned section */
.twb-unassigned-hdr{padding:10px 16px;background:var(--bg-subtle);border-bottom:1px solid var(--border-default);display:flex;align-items:center;gap:10px;}
.twb-unassigned-label{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;flex:1;}

/* Ticket table within each group */
.twb-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.twb-table th{background:var(--bg-subtle);padding:7px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border-default);white-space:nowrap;}
.twb-table td{padding:9px 12px;border-bottom:1px solid var(--border-default);vertical-align:middle;color:var(--text-primary);}
.twb-table tr:last-child td{border-bottom:0;}
.twb-table tbody tr{cursor:pointer;transition:background .1s;}
.twb-table tbody tr:hover{background:var(--bg-hover);}
.twb-table .col-tn{font-family:var(--font-mono);font-weight:600;color:var(--brand-navy);font-size:12px;}
.twb-table .col-desc{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary);}
.twb-table .col-equip{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.twb-empty{padding:32px 24px;text-align:center;color:var(--text-secondary);font-size:13px;}

/* My tickets banner (tech view) */
.twb-my-banner{background:var(--status-info-bg);border:1px solid var(--status-info);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--status-info);}
</style>

<script>
window.PAGES = window.PAGES || {};

var _twbData_          = null;
var _twbSortState_     = { field: '', dir: 'asc' };
var _twbSavedFilters_  = null;

function _twbTh_(field, label) {
  var cls = 'sort-th' + (_twbSortState_.field === field ? ' sort-' + _twbSortState_.dir : '');
  return '<th class="' + cls + '" data-sort-group="twb" data-sort-field="' + field + '" onclick="_twbSortBy_(\'' + field + '\')">' + label + '</th>';
}

function _twbSortBy_(field) {
  _twbSortState_ = { field: field, dir: _twbSortState_.field === field && _twbSortState_.dir === 'asc' ? 'desc' : 'asc' };
  _twbApply_();
}

function _twbSorted_(list, field, dir) {
  var PRI_ORDER = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };
  return list.slice().sort(function(a, b) {
    var av = a[field] != null ? String(a[field]) : '';
    var bv = b[field] != null ? String(b[field]) : '';
    if (field === 'priority') {
      var ap = PRI_ORDER[av] != null ? PRI_ORDER[av] : 99;
      var bp = PRI_ORDER[bv] != null ? PRI_ORDER[bv] : 99;
      return dir === 'asc' ? ap - bp : bp - ap;
    }
    if (field === 'ticketNo') {
      var an = parseInt(av.replace(/\D/g, ''), 10) || 0;
      var bn = parseInt(bv.replace(/\D/g, ''), 10) || 0;
      return dir === 'asc' ? an - bn : bn - an;
    }
    return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
  });
}

// ── Days-open helper ─────────────────────────────────────────────────────────
function _twbAge_(dateStr) {
  if (!dateStr) return { label: '—', color: 'var(--text-tertiary)', title: '' };
  var p = dateStr.split('/');
  var d = (p.length === 3) ? new Date(+p[2], +p[0] - 1, +p[1]) : null;
  if (!d || isNaN(d)) return { label: '—', color: 'var(--text-tertiary)', title: '' };
  var days = Math.floor((Date.now() - d) / 86400000);
  var color = days > 7 ? 'var(--status-critical)' : days > 3 ? '#E65100' : 'var(--text-tertiary)';
  return { label: days + 'd', color: color, title: 'Opened: ' + dateStr };
}

// ── Name parser for grouping ─────────────────────────────────────────────────
// Returns all individual names from a raw assignedTo string (primary + joint)
function _twbParseNames_(raw) {
  if (!raw || !raw.trim()) return [];
  var names = [];
  raw.split(',').forEach(function(s) {
    s = s.trim();
    if (!s) return;
    var m = s.match(/^(.+?)\s*\([^)]+\)$/);
    names.push(m ? m[1].trim() : s);
  });
  return names.filter(Boolean);
}

PAGES['tech-board'] = function(c) { _loadTechBoard_(c); };

function _loadTechBoard_(container) {
  container.innerHTML =
    '<div class="loading-overlay"><div class="spinner"></div><span>Loading work board&#8230;</span></div>';
  fetch(WORKER_URL + '/api/tech-board', {
    headers: { 'X-User-Email': USER ? USER.email : '' }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data && data.error) {
      container.innerHTML = '<div class="twb-empty">Error loading work board: ' + esc(data.error) + '</div>';
      return;
    }
    _renderTechBoard_(data, container);
  })
  .catch(function(err) {
    container.innerHTML = '<div class="twb-empty">Error loading work board: ' + esc(err.message || String(err)) + '</div>';
  });
}

// ── Filter snapshot / restore (preserves selections across refreshes) ────────
function _twbSnapshotFilters_() {
  var deptCbs = document.querySelectorAll('.fp-cb-dept[data-fp="twb"]');
  var priCbs  = document.querySelectorAll('.fp-cb-pri[data-fp="twb"]');
  var staCbs  = document.querySelectorAll('.fp-cb-sta[data-fp="twb"]');
  if (!deptCbs.length && !priCbs.length && !staCbs.length) return;
  var srchEl = document.getElementById('twb-search');
  var fpBar  = document.getElementById('twb-fp-bar');
  var snap = { checkedDepts:[], knownDepts:[], checkedPris:[], checkedStas:[], knownStas:[],
               search: srchEl ? srchEl.value : '', fpOpen: fpBar ? fpBar.classList.contains('fp-open') : true };
  deptCbs.forEach(function(cb) { var v=cb.value.toUpperCase().trim(); snap.knownDepts.push(v); if(cb.checked) snap.checkedDepts.push(v); });
  priCbs.forEach(function(cb)  { if(cb.checked) snap.checkedPris.push(cb.value); });
  staCbs.forEach(function(cb)  { snap.knownStas.push(cb.value); if(cb.checked) snap.checkedStas.push(cb.value); });
  _twbSavedFilters_ = snap;
}

function _twbRefresh_() {
  _twbSnapshotFilters_();
  var pageEl = document.getElementById('page-tech-board');
  if (pageEl) _loadTechBoard_(pageEl);
}

function _renderTechBoard_(data, container) {
  _twbData_ = data;
  var isManager      = data.isManager;
  var tickets        = data.tickets || [];
  var userOwnedDepts = (data.userOwnedDepts || []).map(function(d) { return d.toUpperCase().trim(); });

  var allDepts = [], allStas = [];
  tickets.forEach(function(t) {
    if (t.dept   && allDepts.indexOf(t.dept)  < 0) allDepts.push(t.dept);
    if (t.status && allStas.indexOf(t.status) < 0) allStas.push(t.status);
  });
  allDepts.sort(); allStas.sort();

  var defaultDepts = userOwnedDepts.length ? userOwnedDepts : allDepts.map(function(d) { return d.toUpperCase().trim(); });
  var showDeptFP   = isManager && allDepts.length > 1;

  _twbData_._normOwned    = userOwnedDepts;
  _twbData_._defaultDepts = defaultDepts;

  function buildDeptChips() {
    return allDepts.map(function(d) {
      var checked = defaultDepts.indexOf(d.toUpperCase().trim()) >= 0;
      return '<label class="fp-chip' + (checked ? ' fp-checked' : '') + '">' +
        '<input type="checkbox" value="' + esc(d) + '" data-fp="twb" class="fp-cb-dept"' +
        (checked ? ' checked' : '') + ' onchange="_fpChip_(this);_twbApply_()">' +
        esc(d) + '</label>';
    }).join('');
  }

  function buildPriChips() {
    return ['CRITICAL','HIGH','MEDIUM','LOW'].map(function(p) {
      return '<label class="fp-chip">' +
        '<input type="checkbox" value="' + p + '" data-fp="twb" class="fp-cb-pri"' +
        ' onchange="_fpChip_(this);_twbApply_()">' +
        p + '</label>';
    }).join('');
  }

  function buildStaChips() {
    return allStas.map(function(s) {
      return '<label class="fp-chip fp-checked">' +
        '<input type="checkbox" value="' + esc(s) + '" data-fp="twb" class="fp-cb-sta" checked' +
        ' onchange="_fpChip_(this);_twbApply_()">' +
        esc(s) + '</label>';
    }).join('');
  }

  var fpHtml =
    '<div class="fp-bar fp-open" id="twb-fp-bar">' +
      '<div class="fp-row">' +
        (showDeptFP
          ? '<div class="fp-group">' +
              '<div class="fp-glabel">Department</div>' +
              '<div class="fp-checks">' + buildDeptChips() + '</div>' +
              '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;">' +
                (userOwnedDepts.length ? '<button class="fp-reset" onclick="_twbResetDepts_()">Reset to my depts</button>' : '') +
                '<button class="fp-reset" onclick="_twbSelectAllDepts_()">Select all</button>' +
                '<button class="fp-reset" onclick="_twbDeselectAllDepts_()">Deselect all</button>' +
              '</div>' +
            '</div>'
          : '') +
        '<div class="fp-group">' +
          '<div class="fp-glabel">Priority</div>' +
          '<div class="fp-checks">' + buildPriChips() + '</div>' +
        '</div>' +
        (allStas.length > 1
          ? '<div class="fp-group">' +
              '<div class="fp-glabel">Status</div>' +
              '<div class="fp-checks">' + buildStaChips() + '</div>' +
            '</div>'
          : '') +
      '</div>' +
    '</div>';

  container.innerHTML =
    '<div class="twb-wrap">' +
    '<div class="twb-toolbar">' +
      '<span class="twb-title">' + (isManager ? 'Tech Work Board' : 'My Work Queue') + '</span>' +
      '<span class="twb-count" id="twb-cnt">' + tickets.length + ' ticket' + (tickets.length !== 1 ? 's' : '') + '</span>' +
      '<input class="twb-search" id="twb-search" placeholder="Search&#8230;" oninput="_twbApply_()" />' +
      '<button class="fp-toggle fp-active" id="twb-fp-toggle" onclick="_twbToggleFP_()">' +
        '&#8862; Filters <span class="fp-badge" id="twb-fp-badge" style="display:none">0</span>' +
      '</button>' +
      '<button onclick="_twbRefresh_()" style="height:30px;padding:0 10px;border:1px solid var(--border-default);border-radius:6px;background:#fff;font-size:12px;cursor:pointer;color:var(--text-secondary);" title="Refresh">&#8635;</button>' +
    '</div>' +
    fpHtml +
    (!isManager ? '<div class="twb-my-banner">Showing tickets assigned to <strong>' + esc(data.userDisplayName) + '</strong></div>' : '') +
    '<div id="twb-body"></div>' +
    '</div>';

  // Restore filter state if this was a refresh
  var snap = _twbSavedFilters_;
  if (snap) {
    document.querySelectorAll('.fp-cb-dept[data-fp="twb"]').forEach(function(cb) {
      var v = cb.value.toUpperCase().trim();
      if (snap.knownDepts.indexOf(v) >= 0) { cb.checked = snap.checkedDepts.indexOf(v) >= 0; window._fpChip_(cb); }
    });
    document.querySelectorAll('.fp-cb-pri[data-fp="twb"]').forEach(function(cb) {
      cb.checked = snap.checkedPris.indexOf(cb.value) >= 0; window._fpChip_(cb);
    });
    document.querySelectorAll('.fp-cb-sta[data-fp="twb"]').forEach(function(cb) {
      if (snap.knownStas.indexOf(cb.value) >= 0) { cb.checked = snap.checkedStas.indexOf(cb.value) >= 0; window._fpChip_(cb); }
    });
    var srchEl = document.getElementById('twb-search');
    if (srchEl) srchEl.value = snap.search;
    var fpBarEl = document.getElementById('twb-fp-bar');
    if (fpBarEl) fpBarEl.classList.toggle('fp-open', snap.fpOpen);
    var fpBtn = document.getElementById('twb-fp-toggle');
    if (fpBtn) fpBtn.classList.toggle('fp-active', snap.fpOpen);
    _twbSavedFilters_ = null;
  }

  _twbApply_();
}

function _twbApply_() {
  if (!_twbData_) return;
  var q  = document.getElementById('twb-search');
  var qv = q ? q.value.toLowerCase() : '';

  var deptCbs = document.querySelectorAll('.fp-cb-dept[data-fp="twb"]');
  var priCbs  = document.querySelectorAll('.fp-cb-pri[data-fp="twb"]');
  var staCbs  = document.querySelectorAll('.fp-cb-sta[data-fp="twb"]');

  var checkedDepts = [], checkedPris = [], checkedStas = [];
  deptCbs.forEach(function(cb) { if (cb.checked) checkedDepts.push(cb.value.toUpperCase().trim()); });
  priCbs.forEach(function(cb)  { if (cb.checked) checkedPris.push(cb.value); });
  staCbs.forEach(function(cb)  { if (cb.checked) checkedStas.push(cb.value); });

  var list = (_twbData_.tickets || []).filter(function(t) {
    if (checkedDepts.length && checkedDepts.indexOf((t.dept || '').toUpperCase().trim()) < 0) return false;
    if (checkedPris.length  && checkedPris.indexOf(t.priority) < 0) return false;
    if (checkedStas.length  && checkedStas.indexOf(t.status)   < 0) return false;
    if (qv) {
      var hay = (t.ticketNo + ' ' + t.dept + ' ' + t.specificEquip + ' ' +
                 t.description + ' ' + (t.assignedTo || '')).toLowerCase();
      if (hay.indexOf(qv) < 0) return false;
    }
    return true;
  });

  if (_twbSortState_.field) list = _twbSorted_(list, _twbSortState_.field, _twbSortState_.dir);
  _twbRender_(list, _twbData_.isManager, _twbData_.techs || []);

  // Update filter badge
  var nActive = 0;
  if (deptCbs.length && checkedDepts.length < deptCbs.length) nActive++;
  if (checkedPris.length > 0 && checkedPris.length < 4)       nActive++;
  if (staCbs.length && checkedStas.length < staCbs.length)    nActive++;
  if (qv)                                                      nActive++;
  var btn   = document.getElementById('twb-fp-toggle');
  var badge = document.getElementById('twb-fp-badge');
  if (btn)   btn.classList.toggle('fp-active', nActive > 0 || document.getElementById('twb-fp-bar').classList.contains('fp-open'));
  if (badge) { badge.textContent = nActive; badge.style.display = nActive > 0 ? '' : 'none'; }
}

function _twbRender_(tickets, isManager, allTechs) {
  var body  = document.getElementById('twb-body');
  var cntEl = document.getElementById('twb-cnt');
  if (!body) return;

  // Count unique tickets (a ticket can appear in multiple tech groups)
  var uniqueTicketNos = {};
  tickets.forEach(function(t) { uniqueTicketNos[t.ticketNo] = 1; });
  var uniqueCount = Object.keys(uniqueTicketNos).length;
  if (cntEl) cntEl.textContent = uniqueCount + ' ticket' + (uniqueCount !== 1 ? 's' : '');

  if (!isManager) {
    // Tech view: flat table
    body.innerHTML = tickets.length === 0
      ? '<div class="twb-empty">No tickets assigned to you.</div>'
      : '<div class="twb-tech-group">' +
          '<div style="overflow-x:auto;">' +
            '<table class="twb-table">' +
              _twbTableHead_(false) +
              '<tbody>' + tickets.map(function(t) { return _twbRow_(t, false); }).join('') + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>';
    return;
  }

  // Manager view: group by individual assignee, pre-populate from allTechs roster
  var groups = {};
  (allTechs || []).forEach(function(tech) {
    if (!groups[tech.name]) groups[tech.name] = { tickets: [], dept: tech.dept };
  });

  var unassigned = [];
  tickets.forEach(function(t) {
    var names = _twbParseNames_(t.assignedTo);
    if (!names.length) { unassigned.push(t); return; }
    names.forEach(function(name) {
      if (!groups[name]) groups[name] = { tickets: [], dept: '' };
      groups[name].tickets.push(t);
    });
  });

  var html = '';
  var ownedNorm = (_twbData_._normOwned || []);   // already upper-cased
  var techNames = Object.keys(groups).sort(function(a, b) {
    // Own-dept techs float to top; within each tier sort alphabetically
    var aOwned = ownedNorm.indexOf((groups[a].dept || '').toUpperCase().trim()) >= 0 ? 0 : 1;
    var bOwned = ownedNorm.indexOf((groups[b].dept || '').toUpperCase().trim()) >= 0 ? 0 : 1;
    return aOwned !== bOwned ? aOwned - bOwned : a.localeCompare(b);
  });

  if (techNames.length === 0 && unassigned.length === 0) {
    body.innerHTML = '<div class="twb-empty">No active tickets for your departments.</div>';
    return;
  }

  techNames.forEach(function(tech) {
    var group    = groups[tech];
    var list     = group.tickets;
    var dept     = group.dept;
    var initials = tech.trim().split(/\s+/).map(function(w) { return w[0] || ''; }).join('').substring(0, 2).toUpperCase();
    var critCt   = list.filter(function(t) { return t.priority === 'CRITICAL'; }).length;

    html +=
      '<div class="twb-tech-group">' +
        '<div class="twb-tech-hdr">' +
          '<div class="twb-avatar">' + esc(initials) + '</div>' +
          '<div class="twb-tech-name">' + esc(tech) +
            (dept ? '<span class="twb-tech-dept"> &middot; ' + esc(dept) + '</span>' : '') +
          '</div>' +
          '<div class="twb-tech-stats">' +
            (list.length > 0
              ? '<span class="twb-stat-badge">' + list.length + ' ticket' + (list.length !== 1 ? 's' : '') + '</span>' +
                (critCt > 0 ? '<span class="twb-stat-badge crit">' + critCt + ' Critical</span>' : '')
              : '<span class="twb-stat-badge avail">Available</span>') +
          '</div>' +
        '</div>' +
        (list.length > 0
          ? '<div style="overflow-x:auto;"><table class="twb-table">' +
              _twbTableHead_(true) +
              '<tbody>' + list.map(function(t) { return _twbRow_(t, true); }).join('') + '</tbody>' +
            '</table></div>'
          : '<div class="twb-no-tickets">No active tickets</div>') +
      '</div>';
  });

  // Unassigned bucket
  if (unassigned.length > 0) {
    html +=
      '<div class="twb-tech-group">' +
        '<div class="twb-unassigned-hdr">' +
          '<span class="twb-unassigned-label">Unassigned</span>' +
          '<span class="twb-count">' + unassigned.length + ' ticket' + (unassigned.length !== 1 ? 's' : '') + '</span>' +
        '</div>' +
        '<div style="overflow-x:auto;"><table class="twb-table">' +
          _twbTableHead_(true) +
          '<tbody>' + unassigned.map(function(t) { return _twbRow_(t, true); }).join('') + '</tbody>' +
        '</table></div>' +
      '</div>';
  }

  body.innerHTML = html;
}

function _twbTableHead_(showDept) {
  return '<thead><tr>' +
    _twbTh_('ticketNo','Ticket #') +
    _twbTh_('dateOpened','Date Opened') +
    _twbTh_('priority','Priority') +
    _twbTh_('status','Status') +
    (showDept ? _twbTh_('dept','Dept') : '') +
    _twbTh_('specificEquip','Equipment') +
    _twbTh_('description','Description') +
    _twbTh_('estHours','Est Hrs') +
    '<th title="Days since ticket was opened">Age</th>' +
    '</tr></thead>';
}

function _twbRow_(t, showDept) {
  var age = _twbAge_(t.dateOpened);
  return '<tr onclick="openTicketDetail(\'' + esc(t.ticketNo) + '\')">' +
    '<td class="col-tn">' + esc(t.ticketNo) + '</td>' +
    '<td style="font-size:11.5px;white-space:nowrap;color:var(--text-secondary);">' + esc(t.dateOpened || '—') + '</td>' +
    '<td><span class="pri-badge pri-' + esc(t.priority || '') + '">' + esc(t.priority || '&#8212;') + '</span></td>' +
    '<td><span class="stat-badge stat-' + esc(t.status.replace(/\s+/g, '-')) + '">' + esc(t.status) + '</span></td>' +
    (showDept ? '<td>' + esc(t.dept) + '</td>' : '') +
    '<td class="col-equip" title="' + esc(t.equipCode ? t.equipCode + ' — ' + t.specificEquip : t.specificEquip) + '">' +
      (t.equipCode ? '<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);">' + esc(t.equipCode) + '</span> ' : '') +
      esc(t.specificEquip) + '</td>' +
    '<td class="col-desc" title="' + esc(t.description) + '">' + esc(t.description) + '</td>' +
    '<td style="font-size:11.5px;color:var(--text-secondary);">' + esc(String(t.estHours || '&#8212;')) + '</td>' +
    '<td style="font-size:11.5px;font-weight:600;color:' + age.color + ';" title="' + esc(age.title) + '">' + age.label + '</td>' +
    '</tr>';
}

function _twbToggleFP_() {
  var bar = document.getElementById('twb-fp-bar');
  var btn = document.getElementById('twb-fp-toggle');
  if (!bar) return;
  bar.classList.toggle('fp-open');
  if (btn) btn.classList.toggle('fp-active', bar.classList.contains('fp-open'));
}

function _twbResetDepts_() {
  var owned = (_twbData_ && _twbData_._normOwned) || [];
  document.querySelectorAll('.fp-cb-dept[data-fp="twb"]').forEach(function(cb) {
    var shouldCheck = !owned.length || owned.indexOf(cb.value.toUpperCase().trim()) >= 0;
    cb.checked = shouldCheck;
    if (window._fpChip_) window._fpChip_(cb);
  });
  _twbApply_();
}

function _twbSelectAllDepts_() {
  document.querySelectorAll('.fp-cb-dept[data-fp="twb"]').forEach(function(cb) {
    cb.checked = true; if (window._fpChip_) window._fpChip_(cb);
  });
  _twbApply_();
}

function _twbDeselectAllDepts_() {
  document.querySelectorAll('.fp-cb-dept[data-fp="twb"]').forEach(function(cb) {
    cb.checked = false; if (window._fpChip_) window._fpChip_(cb);
  });
  _twbApply_();
}
</script>
